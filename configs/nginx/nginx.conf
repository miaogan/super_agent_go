# Aegis —— nginx 统一入口
#
# 职责（自 nginx 引入后，nginx 是唯一对外暴露的服务）：
#   1. TLS 终止：443 终结 HTTPS，反代到内部 gateway:8000
#   2. 反向代理：/ 全部转发 gateway（gateway 承担路由/鉴权/SSE）
#   3. 访问控制：登录接口限流防爆破、body 上限、超时
#   4. 统一日志：JSON access log（含 upstream 耗时）
#
# ★ 端口策略（对应 docker-compose 网络收敛）：
#   - gateway 已收敛到 127.0.0.1（仅 nginx 经 compose 内网访问）
#   - 宿主机只暴露 nginx 的 80/443（GATEWAY_HTTP_PORT / GATEWAY_HTTPS_PORT）
#   - 所有内部 RPC/健康端口仍绑定 127.0.0.1，不对外
#
# ★ SSE 流式（/api/v1/agents/*/chat/stream）必须的 3 项：
#   - proxy_buffering off        （否则首字节被缓存，前端看不到流）
#   - proxy_read_timeout 3600s   （长连接，默认 60s 会掐断流）
#   - proxy_http_version 1.1     （配合 keepalive 复用连接）
#
# ★ client_max_body_size：gateway 默认 AEGIS_GATEWAY__MAX_BODY_BYTES=4MB，
#   这里 10m 只作为 nginx 侧前置防线；真要传 >4MB 文档需同步调大 gateway 配置。

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","host":"$host",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"body_bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
        '"xff":"$http_x_forwarded_for","ua":"$http_user_agent"}';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # ---- gzip（文本接口压缩）----
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1k;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;

    # ---- 上游：compose 内网服务名 ----
    upstream aegis_gateway {
        server gateway:8000;
        keepalive 32;   # 复用连接，SSE 高频转发与登录高峰都受益
    }

    # ---- 限流 zone：登录接口防爆破（每 IP 每秒 2 个，突发 4）----
    limit_req_zone $binary_remote_addr zone=aegis_login:10m rate=2r/s;

    # ============================================================
    # 80：HTTP（本地开发直连方便；生产可改为 301 跳 443）
    # ============================================================
    server {
        listen       80;
        server_name  aegis.local localhost;

        # 健康检查 / 指标：nginx 本地应答，不打扰 gateway
        location = /healthz { return 200 '{"healthy":true,"service":"nginx"}'; }
        location = /livez   { return 200 'ok'; }
        location = /readyz  { return 200 'ready'; }
        location = /metrics {
            proxy_pass http://aegis_gateway;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://aegis_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            # SSE 长连接
            proxy_buffering     off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 10s;

            client_max_body_size 10m;
        }
    }

    # ============================================================
    # 443：HTTPS（TLS 终止 + 反代）
    # ============================================================
    server {
        listen       443 ssl;
        http2        on;
        server_name  aegis.local localhost;

        # ★ 生产替换为真实证书（certbot / 云厂商签发），
        #   并把私钥权限收为 root:root 600 —— 自签证书仅限本地开发
        ssl_certificate     /etc/nginx/certs/aegis-dev.crt;
        ssl_certificate_key /etc/nginx/certs/aegis-dev.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 登录接口限流（防爆破）
        location /api/v1/auth/login {
            limit_req zone=aegis_login burst=4 nodelay;
            proxy_pass http://aegis_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://aegis_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            proxy_buffering     off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 10s;

            client_max_body_size 10m;
        }
    }
}

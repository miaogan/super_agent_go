# Aegis —— 测试环境编排（Docker）
#
# 用法：
#   docker compose up -d                          # 起全部（真实依赖）
#   docker compose up -d gateway agent_service   # 按依赖顺序起部分
#   docker compose --profile mock up -d          # 全部走 mock，不连中间件
#   docker compose logs -f gateway
#   docker compose down -v                       # 连数据卷一起清
#
# ★ 为什么中间件拆成 4 个容器而不是用 Milvus 自带的一体镜像：
#   etcd 的一致性参数、MinIO 的纠删码配置都直接影响数据可靠性，
#   显式拆开能分别控制与调参，也便于出问题时定位是哪个环节。
#
# ★ 为什么不用 depends_on: condition: service_healthy：
#   Kitex 服务启动时不需要下游就绪（Nacos 注册 + 按需建连），
#   硬等 healthy 只会让启动顺序脆弱。各服务内部有重连逻辑。
name: aegis

# ---------- 网络 ----------
networks:
  aegis:
    driver: bridge

volumes:
  pg-data:
    driver: local
  milvus-data:
    driver: local
  etcd-data:
    driver: local
  minio-data:
    driver: local

# ---------- 公共构建配置 ----------
#
# 每个服务只是换 Dockerfile 的 SERVICE / HEALTH_PORT 构建参数，
# 其余（restart / networks）一致，提到这里省掉 12 次重复。
#
# 注意 build.args 不能用 anchor 变量，SERVICE 与 HEALTH_PORT
# 每个服务都不同，只能在各自的 build 块里显式传。
x-build: &build-default
  restart: unless-stopped
  networks: [aegis]

x-build-auth: &build-auth
  <<: *build-default
  build:
    context: .
    dockerfile: Dockerfile
    args: { SERVICE: auth_service, HEALTH_PORT: "8090" }

x-build-user: &build-user
  <<: *build-default
  build:
    context: .
    dockerfile: Dockerfile
    args: { SERVICE: user_service, HEALTH_PORT: "8092" }

x-build-llm: &build-llm
  <<: *build-default
  build:
    context: .
    dockerfile: Dockerfile
    args: { SERVICE: llm_service, HEALTH_PORT: "8094" }

x-build-rag: &build-rag
  <<: *build-default
  build:
    context: .
    dockerfile: Dockerfile
    args: { SERVICE: rag_service, HEALTH_PORT: "8095" }

x-build-agent: &build-agent
  <<: *build-default
  build:
    context: .
    dockerfile: Dockerfile
    args: { SERVICE: agent_service, HEALTH_PORT: "8096" }

x-build-gateway: &build-gateway
  <<: *build-default
  build:
    context: .
    dockerfile: Dockerfile
    args: { SERVICE: gateway, HEALTH_PORT: "8000" }

# ---------- Sonic 高性能镜像 ----------
#
# 与上面 6 个标准镜像的唯一差别：build.args 里带上 SONIC_TAGS。
# Dockerfile 用同一个文件，只是多传一个参数 —— 避免维护两套构建逻辑。
#
# 用法：
#   docker compose --profile sonic build gateway-sonic
#   docker compose --profile sonic up -d
#
# ★启用前先确认架构：Sonic 依赖 JIT，仅 amd64/arm64 有加速。
#   在 linux/arm64 上构建会静默回落标准库，镜像标签写着 sonic
#   但没有任何加速（启动日志里 json_native=false 会如实告知）。
#   用 `docker compose --profile sonic run --rm gateway-sonic \
#      sh -c 'echo $AEGIS_JSON__ENGINE'` 只能看配置，
#   真实引擎看启动日志的 json_engine= 字段。
x-build-sonic-gateway: &build-sonic-gateway
  <<: *build-gateway
  build:
    context: .
    dockerfile: Dockerfile
    args:
      SERVICE: gateway
      HEALTH_PORT: "8000"
      SONIC_TAGS: sonic
      SONIC_VER: "1.15.0"
    # 构建期就能用 docker inspect 看出这是 sonic 镜像
    labels:
      aegis.json.engine: "sonic"
      aegis.json.sonic: "v1.15.0"

x-build-sonic-llm: &build-sonic-llm
  <<: *build-llm
  build:
    context: .
    dockerfile: Dockerfile
    args:
      SERVICE: llm_service
      HEALTH_PORT: "8094"
      SONIC_TAGS: sonic
      SONIC_VER: "1.15.0"
    # 构建期就能用 docker inspect 看出这是 sonic 镜像
    labels:
      aegis.json.engine: "sonic"
      aegis.json.sonic: "v1.15.0"

x-build-sonic-rag: &build-sonic-rag
  <<: *build-rag
  build:
    context: .
    dockerfile: Dockerfile
    args:
      SERVICE: rag_service
      HEALTH_PORT: "8095"
      SONIC_TAGS: sonic
      SONIC_VER: "1.15.0"
    # 构建期就能用 docker inspect 看出这是 sonic 镜像
    labels:
      aegis.json.engine: "sonic"
      aegis.json.sonic: "v1.15.0"

x-build-sonic-agent: &build-sonic-agent
  <<: *build-agent
  build:
    context: .
    dockerfile: Dockerfile
    args:
      SERVICE: agent_service
      HEALTH_PORT: "8096"
      SONIC_TAGS: sonic
      SONIC_VER: "1.15.0"
    # 构建期就能用 docker inspect 看出这是 sonic 镜像
    labels:
      aegis.json.engine: "sonic"
      aegis.json.sonic: "v1.15.0"

# ---------- 公共环境变量 ----------
#
# YAML anchors 让 6 个服务的公共配置只写一次。
# ★ environment 是靠 <<: *env 合并的，所以服务自己再写
#   AEGIS_XXX 也不会覆盖这里的值 —— Compose 对 environment
#   的 anchor 合并是"整体替换而非深合并"，
#   需要追加时请把服务特有的键也写进本片段，或另起一个片段。
x-env: &env
  # 容器内服务发现走 Compose DNS，服务名即可路由
  AEGIS_NACOS__ENABLED: "${AEGIS_NACOS_ENABLED:-false}"
  AEGIS_NACOS__ADDRS: "nacos:8848"
  AEGIS_NACOS__NAMESPACE: "public"
  AEGIS_NACOS__GROUP: "DEFAULT_GROUP"
  AEGIS_NACOS__REGISTER_ENABLED: "true"

  # ★ 凭证全部走变量注入（默认值仅限本地开发），
  #   部署时在 .env 里覆盖，禁止把真实密码写进本文件
  AEGIS_POSTGRES__DSN: "postgres://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD:-aegis}@postgres:5432/${POSTGRES_DB:-aegis}?sslmode=disable"

  AEGIS_AUTH__JWT_SECRET: "${AEGIS_JWT_SECRET:-aegis-dev-secret-change-me-in-production}"
  AEGIS_AUTH__ISSUER: "aegis"
  AEGIS_AUTH__AUDIENCE: "aegis"

  # 服务间内部认证（Kitex TTHeader 共享令牌，见 pkg/internalauth）
  # ★ 生产必须换成强随机值；为空则关闭认证（仅本地 mock 可接受）
  AEGIS_INTERNAL__TOKEN: "${AEGIS_INTERNAL_TOKEN:-aegis-internal-dev-token-change-me}"

  # 追踪（OTLP HTTP）：默认关闭，零开销；
  # 开启需 --profile obs 拉起 jaeger，并在 .env 里 AEGIS_OTEL_ENABLED=true
  AEGIS_OTEL__ENABLED: "${AEGIS_OTEL_ENABLED:-false}"
  AEGIS_OTEL__ENDPOINT: "${AEGIS_OTEL_ENDPOINT:-http://jaeger:4318}"
  AEGIS_OTEL__SAMPLER_RATIO: "${AEGIS_OTEL_SAMPLER_RATIO:-1}"

  # 检索链路重排模型（rag 段配置，llm_service 的 DefaultRerankModel 也读它，
  # 故放公共块让两个容器都能拿到；与 llm.models 里的 rerank 模型对应）
  AEGIS_RAG__RERANK_MODEL: "gte-rerank-v2"

  AEGIS_LLM__PROVIDER: "${AEGIS_LLM_PROVIDER:-rawhttp}"
  AEGIS_LLM__DEFAULT_MODEL: "${AEGIS_LLM_MODEL:-qwen-plus}"
  AEGIS_LLM__DEFAULT_EMBED_MODEL: "${AEGIS_EMBED_MODEL:-text-embedding-v4}"
  AEGIS_LLM__DEFAULT_EMBED_DIM: "${AEGIS_EMBED_DIM:-1024}"

  AEGIS_MILVUS__ADDR: "milvus:19530"
  AEGIS_MILVUS__COLLECTION: "aegis_chunks"
  # ★ 必须与 AEGIS_LLM__DEFAULT_EMBED_DIM（1024）一致：
  #   embedding 出口是 text-embedding-v4（1024 维 dense + sparse SPLADE），
  #   配 1536 会导致每个切片 Upsert 时被维度校验拒绝
  AEGIS_MILVUS__DIM: "1024"
  # Milvus 已开启 authorizationEnabled（见 milvus 服务），
  # 这里必须是 Milvus 内实际存在的账号：
  #   本地开发用默认 root / Milvus（仅限本机！生产先改口令再接入）。
  AEGIS_MILVUS__USERNAME: "${AEGIS_MILVUS_USERNAME:-root}"
  AEGIS_MILVUS__PASSWORD: "${AEGIS_MILVUS_PASSWORD:-Milvus}"

  AEGIS_LOG__LEVEL: "info"
  AEGIS_LOG__JSON: "true"

  # ---- JSON 引擎 ----
  #
  # auto = 用构建进来的引擎，不干预（标准镜像的默认行为）。
  # ★ 这里不用 strict：非 sonic 镜像上要求 engine=sonic 会直接启动失败，
  #   而"标准镜像跑标准库"本来就是正确状态，不该报错。
  #   strict=true 只用在确实要求高性能的 sonic 变体里（见 x-env-sonic-*）。
  AEGIS_JSON__ENGINE: "auto"
  AEGIS_JSON__STRICT: "false"
  AEGIS_JSON__PRINT_ENGINE: "true"

# ---------- 服务特有环境变量 ----------
#
# ★ 必须与 x-env 分开定义、再整体引用。
#   Compose 的 <<: 是"同名键整个替换"，把服务特有键直接追加到
#   同一个 environment 块里虽然能写，但一旦有人调整顺序或
#   误以为会深合并，就会出现公共变量静默丢失。
# ★ AEGIS_SERVER__RPC_ADDR 只写 host：rpcAddr() 在运行时会自动拼接 Service.Port，
#   端口写在这里会变成 ":8881:8881" 这种 Kitex 无法解析的地址。
#   HTTP_ADDR 走独立代码路径，不受此约束。
x-env-user: &env-user
  <<: *env
  AEGIS_SERVICE__NAME: "user_service"
  AEGIS_SERVICE__PORT: "8882"
  AEGIS_SERVER__RPC_ADDR: "0.0.0.0"
  AEGIS_SERVER__HTTP_ADDR: ":8092"

x-env-auth: &env-auth
  <<: *env
  AEGIS_SERVICE__NAME: "auth_service"
  AEGIS_SERVICE__PORT: "8881"
  AEGIS_SERVER__RPC_ADDR: "0.0.0.0"
  AEGIS_SERVER__HTTP_ADDR: ":8090"
  AEGIS_UPSTREAM__USER_SERVICE: "user_service:8882"

x-env-llm: &env-llm
  <<: *env
  AEGIS_SERVICE__NAME: "llm_service"
  AEGIS_SERVICE__PORT: "8884"
  AEGIS_SERVER__RPC_ADDR: "0.0.0.0"
  AEGIS_SERVER__HTTP_ADDR: ":8094"
  # 真实模型出口：OpenAI 兼容接口，base_url 可换成任意厂商
  #
  # ★★ 这里必须用 models[i] 形式，不能写 AEGIS_LLM__API_KEY / BASE_URL：
  #   LLMConf 顶层没有这两个字段（密钥是「每个模型一份」，
  #   因为不同厂商/模型可能用不同 Key，见 conf.go 的 ModelConf）。
  #   写成顶层单数形式会被applyEnv 静默忽略 ——
  #   容器照常启动、照常返回 401，日志里却找不到任何配置问题线索。
  #
  #   索引与 configs/*.yaml 里 llm.models 列表顺序一致（0 起）。
  #   ★ 前提：模型列表的**顺序**必须与 yaml 严格一致。
  #     改动yaml 里的模型顺序会让索引指向另一个模型——
  #     这是显式索引写法的固有代价，故在 .env 里有醒目注释提醒。
  AEGIS_LLM__MODELS__0__NAME: "qwen-plus"
  AEGIS_LLM__MODELS__0__REAL_MODEL: "qwen-plus"
  AEGIS_LLM__MODELS__0__API_KEY: "${DASHSCOPE_API_KEY:-${OPENAI_API_KEY:-}}"
  AEGIS_LLM__MODELS__0__BASE_URL: "${OPENAI_BASE_URL:-https://llm-yghp3j032j41n5kw.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}"
  # embedding 模型（rag_service 向量化出口）：
  # ★ 切到 text-embedding-v4 以支持 dense+sparse 混合检索
  #   - ENABLE_SPARSE=true + EMBED_NATIVE_PATH 让 rawhttp 走 DashScope 原生接口
  #   - 原生接口 output_type=dense&sparse 同时返回稠密 1024 维 + 稀疏 SPLADE 向量
  AEGIS_LLM__MODELS__1__NAME: "text-embedding-v4"
  AEGIS_LLM__MODELS__1__REAL_MODEL: "text-embedding-v4"
  AEGIS_LLM__MODELS__1__API_KEY: "${DASHSCOPE_API_KEY:-${OPENAI_API_KEY:-}}"
  AEGIS_LLM__MODELS__1__BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  AEGIS_LLM__MODELS__1__ENABLE_SPARSE: "true"
  AEGIS_LLM__MODELS__1__EMBED_NATIVE_PATH: "text-embedding/text-embedding"
  # rerank 模型（检索链路重排出口）：
  # ★ 走 DashScope 原生 /api/v1/services/rerank/{服务名} 路径，
  #   rerank_path 填「服务名」不是模型名（见 conf.ModelConf.RerankPath）。
  #   base_url 必须用与 chat 同一 Workspace 的专属 MaaS host ——
  #   rerank 端点拼的是「host + /api/v1/services/rerank/...」，
  #   dashscope.aliyuncs.com 通用域会 404/400。
  #   gte-rerank-v2 已在当前账号实测开通（qwen3-text-rerank 未开通）。
  AEGIS_LLM__MODELS__2__NAME: "gte-rerank-v2"
  AEGIS_LLM__MODELS__2__REAL_MODEL: "gte-rerank-v2"
  AEGIS_LLM__MODELS__2__API_KEY: "${DASHSCOPE_API_KEY:-${OPENAI_API_KEY:-}}"
  AEGIS_LLM__MODELS__2__BASE_URL: "${OPENAI_BASE_URL:-https://llm-yghp3j032j41n5kw.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}"
  AEGIS_LLM__MODELS__2__RERANK_PATH: "text-rerank/text-rerank"

x-env-rag: &env-rag
  <<: *env
  AEGIS_SERVICE__NAME: "rag_service"
  AEGIS_SERVICE__PORT: "8885"
  AEGIS_SERVER__RPC_ADDR: "0.0.0.0"
  AEGIS_SERVER__HTTP_ADDR: ":8095"
  AEGIS_UPSTREAM__LLM_SERVICE: "llm_service:8884"
  # 三级降级：Milvus 挂了就走 PG 关键词检索，而不是整体报错
  AEGIS_RAG__KEYWORD_FALLBACK_ENABLED: "true"
  AEGIS_RAG__ENABLE_INGEST: "true"
  # ---------- 混合检索（多来源，防单源）----------
  # 向量 + 关键词常驻 + mock 网络检索：任一来源故障不影响其他来源
  AEGIS_RAG__MERGE_STRATEGY: "rrf"
  AEGIS_RAG__ENABLE_KEYWORD_SEARCH: "true"
  AEGIS_RAG__ENABLE_WEB_SEARCH: "true"
  AEGIS_RAG__WEB_SEARCH__PROVIDER: "mock"
  # MinIO（业务对象存储：RAG 文件原始副本）
  # ★ 注意：这是 aegis-minio（业务用），不是 Milvus 内置的 minio/minio 组件
  # ★ 凭证与下方 minio 服务的 MINIO_ROOT_* 同源，改口令两处会一起变
  AEGIS_MINIO__ENDPOINT: "aegis-minio:9000"
  AEGIS_MINIO__ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
  AEGIS_MINIO__SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
  AEGIS_MINIO__BUCKET: "aegis"
  AEGIS_MINIO__USE_SSL: "false"

x-env-agent: &env-agent
  <<: *env
  AEGIS_SERVICE__NAME: "agent_service"
  AEGIS_SERVICE__PORT: "8886"
  AEGIS_SERVER__RPC_ADDR: "0.0.0.0"
  AEGIS_SERVER__HTTP_ADDR: ":8096"
  AEGIS_UPSTREAM__LLM_SERVICE: "llm_service:8884"
  AEGIS_UPSTREAM__RAG_SERVICE: "rag_service:8885"
  AEGIS_AGENT__SESSION_TTL: "24h"
  AEGIS_AGENT__ENABLE_RAG: "true"

x-env-gateway: &env-gateway
  <<: *env
  AEGIS_SERVICE__NAME: "gateway"
  AEGIS_GATEWAY__ADDR: ":8000"
  # ★ WriteTimeout 必须为 0：SSE 长连接会被默认 3s 超时切断，
  #   表现为"推了几个 token 就断流"。
  AEGIS_GATEWAY__WRITE_TIMEOUT: "0s"
  AEGIS_GATEWAY__STREAM_TIMEOUT: "300s"
  AEGIS_GATEWAY__ALLOW_ORIGINS: "${AEGIS_ALLOW_ORIGINS:-http://localhost:5173}"
  AEGIS_UPSTREAM__AUTH_SERVICE: "auth_service:8881"
  AEGIS_UPSTREAM__USER_SERVICE: "user_service:8882"
  AEGIS_UPSTREAM__AGENT_SERVICE: "agent_service:8886"
  AEGIS_UPSTREAM__LLM_SERVICE: "llm_service:8884"
  AEGIS_UPSTREAM__RAG_SERVICE: "rag_service:8885"

# ---------- sonic 变体环境变量 ----------
#
# ★ strict=true 是这里的关键：
#   sonic 变体存在的全部意义就是"用 Sonic 跑"。
#   若镜像因架构 / Go 版本原因静默回落到标准库，
#   那它跟普通镜像毫无区别，却顶着高性能的名字 ——
#   此时宁可启动失败，也不要让这种偏差混进压测数据。
#
# 只对 JSON 密集的服务做 sonic 变体：
# gateway（收发包解析）、llm_service（每 token 一次序列化）、
# rag_service（文档解析）、agent_service（编排上下文）。
# auth_service / user_service 的 JSON 负载极轻，不值得多一套镜像。
x-env-sonic-gateway: &env-sonic-gateway
  <<: *env-gateway
  AEGIS_JSON__ENGINE: "sonic"
  AEGIS_JSON__STRICT: "true"

x-env-sonic-llm: &env-sonic-llm
  <<: *env-llm
  AEGIS_JSON__ENGINE: "sonic"
  AEGIS_JSON__STRICT: "true"

x-env-sonic-rag: &env-sonic-rag
  <<: *env-rag
  AEGIS_JSON__ENGINE: "sonic"
  AEGIS_JSON__STRICT: "true"

x-env-sonic-agent: &env-sonic-agent
  <<: *env-agent
  AEGIS_JSON__ENGINE: "sonic"
  AEGIS_JSON__STRICT: "true"

# ---------- mock 变体环境变量 ----------
#
# mock 模式不连任何中间件，因此不能复用上面的 env
# （否则会带着指向不存在的 PG/Milvus 的配置去连）。
x-mock-env: &mock-env
  AEGIS_MOCK__ENABLED: "true"
  AEGIS_NACOS__ENABLED: "false"
  AEGIS_LOG__LEVEL: "info"

# ★ 同上：rpcAddr() 会自动拼 Service.Port，RPC_ADDR 只写 host
x-mock-auth: &mock-auth
  <<: *mock-env
  AEGIS_SERVICE__NAME: "auth_service"
  AEGIS_SERVICE__PORT: "8881"
  AEGIS_SERVER__RPC_ADDR: "0.0.0.0"
  AEGIS_SERVER__HTTP_ADDR: ":8090"
  AEGIS_AUTH__JWT_SECRET: "aegis-dev-secret-change-me-in-production"
  AEGIS_AUTH__ISSUER: "aegis"
  AEGIS_AUTH__AUDIENCE: "aegis"
  # ★ 不需要（也不存在）AEGIS_AUTH__MOCK_IDP__ENABLED：
  #   内嵌 IdP 的启动条件是「未配置任何外部 idps + 处于 mock 模式」
  #   （见 auth_service/cmd/main.go），即已由 AEGIS_MOCK__ENABLED 决定。
  #   曾在这里写过一个 MOCK_IDP__ENABLED，它不生效只是因为没人读它——
  #   而看compose 的人会以为「关掉它就能关掉内嵌 IdP」，实际关不掉。
  AEGIS_UPSTREAM__USER_SERVICE: "mock-user:8882"

x-mock-user: &mock-user
  <<: *mock-env
  AEGIS_SERVICE__NAME: "user_service"
  AEGIS_SERVICE__PORT: "8882"
  AEGIS_SERVER__RPC_ADDR: "0.0.0.0"
  AEGIS_SERVER__HTTP_ADDR: ":8092"

x-mock-llm: &mock-llm
  <<: *mock-env
  AEGIS_SERVICE__NAME: "llm_service"
  AEGIS_SERVICE__PORT: "8884"
  AEGIS_SERVER__RPC_ADDR: "0.0.0.0"
  AEGIS_SERVER__HTTP_ADDR: ":8094"

x-mock-rag: &mock-rag
  <<: *mock-env
  AEGIS_SERVICE__NAME: "rag_service"
  AEGIS_SERVICE__PORT: "8885"
  AEGIS_SERVER__RPC_ADDR: "0.0.0.0"
  AEGIS_SERVER__HTTP_ADDR: ":8095"
  AEGIS_UPSTREAM__LLM_SERVICE: "mock-llm:8884"

x-mock-agent: &mock-agent
  <<: *mock-env
  AEGIS_SERVICE__NAME: "agent_service"
  AEGIS_SERVICE__PORT: "8886"
  AEGIS_SERVER__RPC_ADDR: "0.0.0.0"
  AEGIS_SERVER__HTTP_ADDR: ":8096"
  AEGIS_UPSTREAM__LLM_SERVICE: "mock-llm:8884"
  AEGIS_UPSTREAM__RAG_SERVICE: "mock-rag:8885"

x-mock-gateway: &mock-gateway
  <<: *mock-env
  AEGIS_SERVICE__NAME: "gateway"
  AEGIS_GATEWAY__ADDR: ":8000"
  AEGIS_GATEWAY__WRITE_TIMEOUT: "0s"
  AEGIS_UPSTREAM__AUTH_SERVICE: "mock-auth:8881"
  AEGIS_UPSTREAM__USER_SERVICE: "mock-user:8882"
  AEGIS_UPSTREAM__AGENT_SERVICE: "mock-agent:8886"
  AEGIS_UPSTREAM__LLM_SERVICE: "mock-llm:8884"
  AEGIS_UPSTREAM__RAG_SERVICE: "mock-rag:8885"

services:
  # ===============================================================
  # 基础设施
  # ===============================================================

  postgres:
    image: postgres:18-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    networks: [aegis]
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-aegis}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aegis}"
      POSTGRES_DB: "${POSTGRES_DB:-aegis}"
      # 中文文档解析需要 UTF-8；不设的话某些 locale 下会按 LATIN1 建库
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # ★ 只绑定本机回环：PG 里存着全部业务数据，不应暴露给局域网。
      #   本机开发工具（DataGrip/psql）照常通过 localhost 访问。
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    # PG 18+ 官方镜像数据目录结构改为 /var/lib/postgresql/<major>/main
    # 必须挂到 /var/lib/postgresql 而不是 /var/lib/postgresql/data
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: aegis-etcd
    restart: unless-stopped
    networks: [aegis]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:latest
    container_name: aegis-minio
    restart: unless-stopped
    networks: [aegis]
    environment:
      # ★ 默认 minioadmin/minioadmin 仅限本地开发，部署时在 .env 覆盖。
      #   rag_service（AEGIS_MINIO__*）与 Milvus（下方 MINIO_ACCESS_KEY_ID）
      #   都引用同一组变量，改这里即可全局生效。
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    command: ["minio", "server", "/minio_data"]
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    # ★ 版本锁定 3.0.2（与 docs/02 §4.8、docs/05 §3.1 一致）。
    #   Go 侧对应 client/v3，与 2.x 的 client/v2 类型不互通。
    #   ⚠️ 当前仓库里pkg/vectordb 只有接口 + mockstore，
    #     真实 milvus3 适配层尚未实现（见 ADR-006 的落地状态）。
    #     在适配层落地前，本服务仅供 mock 冒烟之外的联调占位。
    image: milvusdb/milvus:v3.0.2
    container_name: aegis-milvus
    restart: unless-stopped
    networks: [aegis]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: "etcd:2379"
      MINIO_ADDRESS: "minio:9000"
      MINIO_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      COMMON_STORAGETYPE: "local"
      # ★ 开启 Milvus 自身鉴权（此前是 false = 任何接入网络者可读写全部集合）。
      #   账号用默认 root / Milvus，与 x-env 里 AEGIS_MILVUS__USERNAME/PASSWORD
      #   一致；⚠️ 默认口令仅限本机开发，非本机环境必须先改 root 口令。
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      # ★ 改掉默认 rootPath（by-dev）：CVE-2026-26190 利用链的一环
      ETCD_ROOTPATH: aegis-milvus-dev
      # ★ 保持 false 以保住回滚 2.x 的能力（启用并落盘后不可逆）
      COMMON_STORAGE_USELOONFFI: "false"
      # ★ 提高 flush 配额：v3 默认 flushRate.collection.max=0.1（每 10s 一次），
      #   rag 入库每批切片都要 Flush，直接触发 grpc RateLimiter 拒绝
      #   （报 rate limit exceeded[rate=0.1]），向量同步进补偿队列。
      #   env 命名规则与 ETCD_ENDPOINTS 相同：点→下划线、大写前缀。
      QUOTAANDLIMITS_FLUSHRATE_COLLECTION_MAX: "100"
      QUOTAANDLIMITS_FLUSHRATE_COLLECTION_ENABLED: "true"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      # Milvus 首次启动要初始化 etcd + 建索引，给足时间
      start_period: 90s
      retries: 10
    ports:
      # ★ gRPC 端口只绑定本机：开启鉴权后是第一道防线，网络隔离是第二道
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      # ★ metrics 端口仅绑定本机：CVE-2026-26190（CVSS 9.8）的攻击面，
      #   严禁写成 "9091:9091"（那会监听 0.0.0.0）。
      - "127.0.0.1:9091:9091"

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: aegis-nacos
    restart: unless-stopped
    networks: [aegis]
    environment:
      MODE: "standalone"
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: "256m"
      JVM_XMX: "512m"
    ports:
      # Nacos 控制台仅本机访问；容器间服务发现走内部网络
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-9848}:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ===============================================================
  # 应用服务（真实依赖）
  # ===============================================================

  auth_service:
    <<: *build-auth
    container_name: aegis-auth
    profiles: ["real"]
    environment: *env-auth
    depends_on: [postgres, nacos]
    ports:
      # ★ 内部服务的 RPC/健康端口只绑定本机回环：
      #   容器间经 Compose 内部网络互通，宿主机仅排障时访问，
      #   不应把无用户鉴权的内部端口暴露到局域网（gateway 8000 是唯一入口）
      - "127.0.0.1:${AUTH_RPC_PORT:-8881}:8881"
      - "127.0.0.1:${AUTH_HTTP_PORT:-8090}:8090"

  user_service:
    <<: *build-user
    container_name: aegis-user
    profiles: ["real"]
    environment: *env-user
    depends_on: [postgres, nacos]
    ports:
      - "127.0.0.1:${USER_RPC_PORT:-8882}:8882"
      - "127.0.0.1:${USER_HTTP_PORT:-8092}:8092"

  llm_service:
    <<: *build-llm
    container_name: aegis-llm
    profiles: ["real"]
    environment: *env-llm
    depends_on: [nacos]
    ports:
      - "127.0.0.1:${LLM_RPC_PORT:-8884}:8884"
      - "127.0.0.1:${LLM_HTTP_PORT:-8094}:8094"

  rag_service:
    <<: *build-rag
    container_name: aegis-rag
    profiles: ["real"]
    environment: *env-rag
    depends_on: [postgres, milvus, nacos]
    ports:
      - "127.0.0.1:${RAG_RPC_PORT:-8885}:8885"
      - "127.0.0.1:${RAG_HTTP_PORT:-8095}:8095"

  agent_service:
    <<: *build-agent
    container_name: aegis-agent
    profiles: ["real"]
    environment: *env-agent
    depends_on: [postgres, milvus, nacos, llm_service, rag_service]
    ports:
      - "127.0.0.1:${AGENT_RPC_PORT:-8886}:8886"
      - "127.0.0.1:${AGENT_HTTP_PORT:-8096}:8096"

  gateway:
    <<: *build-gateway
    container_name: aegis-gateway
    profiles: ["real"]
    environment:
      <<: *env-gateway
      # ★ 前端产物：./web/dist 由 npm run build 产出（web/ 是 Vue3 工程）。
      #   挂只读 volume 而非打进镜像 —— 前端迭代只需重新 build，无需重启容器。
      #   开发期改前端也可用 web/ 下的 vite dev server（代理到 gateway 8000）。
      AEGIS_GATEWAY__STATIC_DIR: "/app/web"
    depends_on: [auth_service, user_service, agent_service]
    volumes:
      - ./web/dist:/app/web:ro
    ports:
      # ★ 收敛到回环：对外入口已交给 nginx（compose 内网 gateway:8000 反代），
      #   宿主机 8000 仅保留给本机排障/直连调试
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"

  # ===============================================================
  # nginx —— 统一对外入口（TLS 终止 + 反向代理 + 访问控制）
  # ===============================================================
  #
  # 职责与配置说明见 configs/nginx/nginx.conf 顶部注释。
  # 引入后宿主机只暴露 80/443，gateway 与全部内部服务不再对外。
  #
  # 用法：
  #   docker compose --profile real up -d nginx
  #   访问：https://127.0.0.1:443（自签证书，浏览器需信任或加 -k）
  #   健康：curl -s http://127.0.0.1:80/healthz
  #
  # ★ 生产部署：把 configs/nginx/certs/ 里的自签证书换成真实证书
  #   （certbot / 云厂商），私钥权限 root:root 600。
  nginx:
    image: nginx:1.27
    container_name: aegis-nginx
    profiles: ["real"]
    restart: unless-stopped
    networks: [aegis]
    depends_on: [gateway]
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===============================================================
  # 观测栈（profiles: obs，默认不启动）
  # ===============================================================
  #
  # 用法：
  #   1. docker compose --profile obs up -d
  #   2. .env 里加 AEGIS_OTEL_ENABLED=true，重启业务服务
  #   3. 打开 UI：Jaeger http://127.0.0.1:16686
  #              Prometheus http://127.0.0.1:9090
  #
  # ★ Jaeger all-in-one 自带 OTLP HTTP(4318) 接收端，
  #   无需再部署独立 otel-collector；生产量大时再换 collector。
  #
  # ★ 指标端口绑定 127.0.0.1：UI 不暴露局域网；
  #   业务容器走 Compose 内网（jaeger:4318 / 各服务:健康端口）不受影响。
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: aegis-jaeger
    profiles: [obs]
    networks: [aegis]
    ports:
      - "127.0.0.1:4318:4318"   # OTLP HTTP（宿主机程序直发也走这）
      - "127.0.0.1:16686:16686" # 查询 UI

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: aegis-prometheus
    profiles: [obs]
    networks: [aegis]
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  # ===============================================================
  # sonic 变体：JSON 引擎换 Sonic JIT（profiles控制，默认不启动）
  # ===============================================================
  #
  # 用法：
  #   docker compose --profile sonic build
  #   docker compose --profile sonic up -d
  #
  # ★ 与标准镜像同端口不同容器名，二者不能同时 up ——
  #   Compose 的 depends_on 引用的是服务名（如 llm_service），
  #   sonic 变体服务名不同，无法直接顶替上游。
  #   要么全用 sonic，要么全用标准：见下方 AEGIS_SONIC 一键切换说明。
  #
  # AEGIS_SONIC=1 可让整套服务切到 sonic 镜像，
  #   docker compose --profile sonic up -d   （等价于上面的 --profile sonic）
  #
  # 验证引擎是否真的生效：
  #   docker compose logs gateway-sonic | grep json_engine
  #   期望看到 json_engine=sonic；若显示 encoding/json 且 strict=true
  #   服务会直接启动失败，而不是静默降级。

  gateway-sonic:
    <<: *build-sonic-gateway
    container_name: aegis-gateway-sonic
    profiles: [sonic]
    environment: *env-sonic-gateway
    depends_on: [auth_service, user_service, agent-sonic]
    ports:
      - "${GATEWAY_SONIC_PORT:-8000}:8000"

  llm-sonic:
    <<: *build-sonic-llm
    container_name: aegis-llm-sonic
    profiles: [sonic]
    environment: *env-sonic-llm
    depends_on: [nacos]
    ports:
      - "127.0.0.1:${LLM_SONIC_PORT:-8884}:8884"

  rag-sonic:
    <<: *build-sonic-rag
    container_name: aegis-rag-sonic
    profiles: [sonic]
    environment: *env-sonic-rag
    depends_on: [postgres, milvus, nacos, llm-sonic]
    ports:
      - "127.0.0.1:${RAG_SONIC_PORT:-8885}:8885"

  agent-sonic:
    <<: *build-sonic-agent
    container_name: aegis-agent-sonic
    profiles: [sonic]
    environment: *env-sonic-agent
    depends_on: [postgres, milvus, nacos, llm-sonic, rag-sonic]
    ports:
      - "127.0.0.1:${AGENT_SONIC_PORT:-8886}:8886"

  # ===============================================================
  # mock 变体：不连中间件，全部进程内替身
  # ===============================================================
  #
  # 用途：CI 里验证"服务能否启动、链路是否通"，
  # 不必起 PG/Milvus/Nacos/etcd/MinIO —— 省掉数 GB 内存。
  # 与真实版共用同一份 Dockerfile，靠 AEGIS_MOCK__ENABLED 区分。
  # 用法：docker compose --profile mock up -d

  mock-auth:
    <<: *build-auth
    container_name: aegis-mock-auth
    profiles: [mock]
    environment: *mock-auth
    depends_on: [mock-user]

  mock-user:
    <<: *build-user
    container_name: aegis-mock-user
    profiles: [mock]
    environment: *mock-user

  mock-llm:
    <<: *build-llm
    container_name: aegis-mock-llm
    profiles: [mock]
    environment: *mock-llm

  mock-rag:
    <<: *build-rag
    container_name: aegis-mock-rag
    profiles: [mock]
    environment: *mock-rag
    depends_on: [mock-llm]

  mock-agent:
    <<: *build-agent
    container_name: aegis-mock-agent
    profiles: [mock]
    environment: *mock-agent
    depends_on: [mock-llm, mock-rag]

  mock-gateway:
    <<: *build-gateway
    container_name: aegis-mock-gateway
    profiles: [mock]
    environment: *mock-gateway
    depends_on: [mock-auth, mock-user, mock-agent]
    ports:
      # 用 18000 避开本地 scripts/dev.sh 占的 8000
      - "${MOCK_GATEWAY_PORT:-18000}:8000"